<style>
/* Layout: one full-screen Macintosh desktop. Menu bar on top, one document window.
   Deliberately single-look (1-bit Classic or grey Platinum, chosen in the View menu), so no dark-mode blocks. */
:root{
  --ink:#000; --paper:#fff; --mid:#7a7a7a;
  --hilite:#000; --hilite-ink:#fff;
  --face:#fff; --face-hi:#fff; --face-lo:#000; --track:#fff; --thumb:#fff;
  --desk:#fff; --r-bg:#fff; --r-ink:#000;
  --pane-bg:#fff;
  --ui:"WN Chicago","Chicago","Charcoal","Arimo",Arial,sans-serif;
  --ui2:"WN Geneva","Geneva","Arimo",Arial,sans-serif;
  --doc:Times,"Times New Roman","Liberation Serif",Tinos,"DejaVu Serif",serif;
  --dither:conic-gradient(var(--ink) 25%,var(--paper) 0 50%,var(--ink) 0 75%,var(--paper) 0) 0 0/2px 2px;
  color-scheme:light;
}
body[data-look="platinum"]{
  --hilite:#3434a6; --hilite-ink:#fff;
  --face:#dddddd; --face-hi:#ffffff; --face-lo:#8a8a8a; --track:#b4b4b4; --thumb:#a9a9dc;
  --r-bg:#f2f2f2; --r-ink:#222; --pane-bg:#a8a8a8; --mid:#808080;
}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font:400 12px/1.2 var(--ui);overflow:hidden;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit;color:inherit}
#mbar,.menu,.dlg,.tb,#findwin,#bot,#rctl,#readout{font-synthesis:none;-webkit-font-smoothing:none;font-smooth:never}

/* ---------- desktop ---------- */
#desk{position:relative;height:100%;overflow:hidden;background:var(--dither)}
body[data-look="platinum"] #desk{background:#6f6f9f radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/4px 4px}
#desk::after{content:"";position:absolute;inset:0;border-radius:9px;box-shadow:0 0 0 12px #000;pointer-events:none;z-index:500}

/* ---------- menu bar ---------- */
#mbar{position:absolute;top:0;left:0;right:0;height:19px;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;padding-left:10px;z-index:300}
body[data-look="platinum"] #mbar{background:linear-gradient(#eee,#d6d6d6);border-bottom-color:#444}
.mt{padding:0 9px;line-height:19px;cursor:default;white-space:nowrap;display:flex;align-items:center}
.mt svg{display:block}
.mt .apple{display:block;width:14px;height:17px}
.mt .apple .bw{fill:var(--ink)}
.mt.open .apple .bw{fill:var(--hilite-ink)}
.mt .apple .rb{display:none}
body[data-look="platinum"] .mt .apple .rb{display:inline}
body[data-look="platinum"] .mt .apple .bw{display:none}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 8px 2px;max-width:380px}
.welcome-logo{width:84px;height:104px;display:block}
.welcome h3{margin:4px 0 0;font-size:12px;font-weight:400;letter-spacing:.5px}
.welcome p{font-family:var(--ui2);font-weight:400;line-height:1.45;max-width:36ch}
.welcome .w-lead{font-family:var(--ui)}
.welcome .w-sig{font-size:12px;color:var(--mid);margin-top:2px}
.welcome .w-beta{display:inline-block;margin-top:6px;padding:1px 6px;border:1px solid var(--ink);color:var(--ink);font-family:var(--ui)}
.about-logo{width:96px;height:120px;display:block}
.about{display:flex;flex-direction:column;gap:14px;padding:4px 10px;min-width:min(380px,100%);box-sizing:border-box}
.about h3{margin:0;text-align:center;font-size:12px}
.about .credits{display:grid;grid-template-columns:auto auto;justify-content:center;gap:2px 14px}
.about .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mt.open{background:var(--hilite);color:var(--hilite-ink)}
.menu{position:fixed;top:19px;background:var(--paper);border:1px solid var(--ink);box-shadow:1px 1px 0 var(--ink);z-index:310;min-width:120px;padding:1px 0}
body[data-look="platinum"] .menu{background:#e6e6e6;border-color:#555;box-shadow:2px 2px 0 rgba(0,0,0,.35);padding:3px 0}
.mi{display:flex;justify-content:space-between;gap:28px;padding:0 14px 0 20px;height:17px;line-height:17px;white-space:nowrap;position:relative;cursor:default}
.mi .ck{position:absolute;left:6px}
.mi .k{font-variant-numeric:tabular-nums}
.mi.hi{background:var(--hilite);color:var(--hilite-ink)}
.mi.dis{color:var(--mid)}
.sep{height:1px;margin:3px 0;background:repeating-linear-gradient(90deg,var(--mid) 0 1px,transparent 1px 2px)}
body[data-look="platinum"] .sep{background:#9a9a9a;box-shadow:0 1px 0 #fff}
.s-out,.s-sha{--of:var(--paper);--ol:var(--ink)}
.mi.hi .s-out,.mi.hi .s-sha{--of:var(--hilite);--ol:var(--hilite-ink)}
.s-out{color:var(--of);text-shadow:-1px 0 var(--ol),1px 0 var(--ol),0 -1px var(--ol),0 1px var(--ol)}
.s-sha{color:var(--of);text-shadow:-1px 0 var(--ol),1px 0 var(--ol),0 -1px var(--ol),0 1px var(--ol),2px 2px 0 var(--ol)}

/* ---------- windows ---------- */
.window{position:absolute;background:var(--paper);border:1px solid var(--ink);box-shadow:1px 1px 0 var(--ink);display:flex;flex-direction:column;z-index:10}
body[data-look="platinum"] .window{background:var(--face);border-color:#3a3a3a;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 #888,2px 2px 0 rgba(0,0,0,.3);padding:0 5px 5px}

/* ---------------- selection helpers ---------------- */

function updateCaret(){

        const rs=r.getClientRects(),rr=rs[rs.length-1];
        if(rr&&rr.height&&n.data[o-1]!=='\n'){

/* ---------------- structure upkeep ---------------- */
const BLK=/^(P|H1|H2|BLOCKQUOTE|DIV|TABLE|HR|UL|OL)$/;
function ensureBlocks(reg){
  if(!reg.firstChild){reg.innerHTML='<p><br></p>';return}
  const kids=[...reg.childNodes]; if(kids.every(n=>(n.nodeType===1&&BLK.test(n.tagName))||(n.nodeType===3&&!n.data.trim())))return;
  const s=getSelection(); const keep=s.rangeCount?[s.anchorNode,s.anchorOffset]:null;
  let p=null;
  kids.forEach(n=>{
    if(n.nodeType===1&&BLK.test(n.tagName)){p=null;return}
    if(n.nodeType===3&&!n.data.trim()&&!p){n.remove();return}
    if(!p){p=document.createElement('p');reg.insertBefore(p,n)}
    p.appendChild(n);
  });
  if(keep&&keep[0]&&keep[0].isConnected){try{const r=document.createRange();r.setStart(keep[0],keep[1]);r.collapse(true);setRange(r)}catch(e){}}
}
function renumber(){
  const refs=$$('.wn-fn',R.body), order={};

  $$('.wn-note',R.notes).forEach(n=>{if(!order[n.dataset.id])n.remove()});
  refs.forEach(r=>{if(!$(`.wn-note[data-id="${r.dataset.id}"]`,R.notes)){const p=document.createElement('p');p.className='wn-note';p.dataset.id=r.dataset.id;p.innerHTML='<span class="wn-fnum" contenteditable="false"></span> ';R.notes.appendChild(p)}});
  const cur=$$('.wn-note',R.notes);
  cur.forEach(n=>{const f=$('.wn-fnum',n),k=order[n.dataset.id]+'.';if(f&&f.textContent!==k)f.textContent=k});
  const sorted=[...cur].sort((a,b)=>order[a.dataset.id]-order[b.dataset.id]);
  if(sorted.some((n,i)=>n!==cur[i]))sorted.forEach(n=>R.notes.appendChild(n));

  if(R.notes.hidden&&activeReg===R.notes)activeReg=R.body;
}

/* ---------------- undo (snapshot based) ---------------- */
let undoS=[],redoS=[],lastT=0,lastK='';

function snap(){

  if(lastRange){const reg=regionOf(lastRange.startContainer);if(reg){const sp=pathOf(lastRange.startContainer,reg),ep=pathOf(lastRange.endContainer,reg);if(sp&&ep)o.sel={k:regKey(reg),sp,so:lastRange.startOffset,ep,eo:lastRange.endOffset}}}

}
function applySnap(o){
  for(const k in R)R[k].innerHTML=o.h[k];
  st.hdrOn=o.hdrOn;st.ftrOn=o.ftrOn;syncZones();renumber();
  let ok=false;
  if(o.sel){const reg=R[o.sel.k];try{const r=document.createRange();r.setStart(resolve(o.sel.sp,reg),o.sel.so);r.setEnd(resolve(o.sel.ep,reg),o.sel.eo);activeReg=reg;reg.focus({preventScroll:true});setRange(r);ok=true}catch(e){}}

}
let undoBytes=0;
function snapSize(o){let n=0;for(const k in o.h)n+=o.h[k].length;return n}
function record(){const o=snap();o.size=snapSize(o);undoS.push(o);undoBytes+=o.size;
  while(undoS.length>1&&(undoS.length>200||undoBytes>30e6))undoBytes-=undoS.shift().size;
  redoS=[];lastT=0}
function undo(){if(!undoS.length)return beep();redoS.push(snap());applySnap(undoS.pop());lastT=0}
function redo(){if(!redoS.length)return beep();undoS.push(snap());applySnap(redoS.pop());lastT=0}

/* ---------------- change bookkeeping ---------------- */

/* ---------------- layout: page breaks, page lines, page numbers ---------------- */
function offsetIn(el){let y=0;while(el&&el!==sheet){y+=el.offsetTop;el=el.offsetParent}return y}
function layout(){
  if(win.hidden)return;
  $$('.wn-pb',R.body).forEach(pb=>{pb.style.height='0px';const top=offsetIn(pb);pb.style.height=Math.max(24,(Math.floor(top/PH)+1)*PH+PPI-top)+'px'});
  const last=R.notes.hidden?R.body:R.notes;
  const nat=offsetIn(last)+last.offsetHeight+PPI;
  const pages=Math.max(1,Math.ceil((nat-1)/PH));
  sheet.style.height=pages*PH+'px';
  if(pages!==geo.pages||!$('#plines').childElementCount&&pages>1){
    geo.pages=pages;const pl=$('#plines');pl.innerHTML='';
    for(let k=1;k<pages;k++){const d=document.createElement('div');d.className='pline';d.style.top=k*PH+'px';d.innerHTML='<span>Page '+(k+1)+'</span>';pl.appendChild(d)}
  }
  $$('.wn-pg',sheet).forEach(s=>{const v=String(Math.floor(offsetIn(s)/PH)+1);if(s.textContent!==v)s.textContent=v});
  scaler.style.width=Math.floor(geo.PW*PPI*geo.z)+'px';
  scaler.style.height=Math.ceil(pages*PH*geo.z)+'px';
  onScroll();
}
function pageNum(){
  const y=(pane.scrollTop+pane.clientHeight*.3)/geo.z;

}

/* ---------------- view & ruler ---------------- */
function viewMode(){let m=prefs.view;if(m==='auto')m=pane.clientWidth>=600?'fit':'wrap';return m}
function applyView(){
  const w=pane.clientWidth; if(w<60)return;
  const m=viewMode();
  if(m==='wrap'){geo.z=1;geo.ML=geo.MR=.3;geo.PW=Math.floor(w)/PPI}
  else{geo.PW=8.5;geo.ML=geo.MR=1;geo.z=m==='fit'?Math.min(1,w/(8.5*PPI)):1}
  sheet.style.width=geo.PW*PPI+'px';
  sheet.style.setProperty('--ml',geo.ML*PPI+'px');sheet.style.setProperty('--mr',geo.MR*PPI+'px');
  sheet.style.transform=geo.z===1?'':`scale(${geo.z})`;
  $('#rinner').style.transform=geo.z===1?'':`scale(${geo.z})`;
  $('#rinner').style.width=geo.PW*PPI+'px';
  drawRuler();layout();updateRuler();updateCaret();
  $('#vi-fit').classList.toggle('on',m==='fit');

function drawRuler(){
  const c=$('#rcan'),W=Math.round(geo.PW*PPI),H=20,dpr=Math.max(1,(window.devicePixelRatio||1)*geo.z);
  c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.body),ink=cs.getPropertyValue('--r-ink').trim()||'#000',bg=cs.getPropertyValue('--r-bg').trim()||'#fff';
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle=ink;g.fillRect(0,H-1,W,1);
  g.font='9px Geneva, Arimo, sans-serif';g.textBaseline='top';
  const n=Math.floor(geo.PW*8+1e-6);
  for(let i=0;i<=n;i++){const x=Math.round(i*12),h=i%8===0?11:i%4===0?7:i%2===0?4:2;g.fillRect(x,H-1-h,1,h);if(i%8===0)g.fillText(String(i/8),x+3,1)}

}
function metrics(b){

}

  const walk=node=>{[...node.childNodes].forEach(n=>{
    if(n.nodeType===8){n.remove();return}

    if(/^(SCRIPT|STYLE|META|LINK|TITLE|HEAD|IFRAME|OBJECT|NOSCRIPT|SVG|IMG|VIDEO|AUDIO)$/.test(n.tagName)){n.remove();return}
    walk(n);
    if(!OK_TAGS.test(n.tagName)){n.replaceWith(...n.childNodes);return}
    const keep={};const stl=n.style;
    ['fontSize','fontFamily','textAlign','marginLeft','textIndent','marginRight','lineHeight'].forEach(p=>{if(stl&&stl[p])keep[p]=stl[p]});
    const cls=[...n.classList].filter(c=>c==='wn-outline'||c==='wn-shadow');const face=n.getAttribute('face');

  walk(doc.body);return doc.body.innerHTML;

   {l:'Italic',k:'⌘I',c:s.italic,st:'font-style:italic',a:()=>cmd(()=>ex('italic')),en:ed},
   {l:'Underline',k:'⌘U',c:s.underline,st:'text-decoration:underline',a:()=>cmd(()=>ex('underline')),en:ed},
   {l:'Outline',c:s.outline,cls:'s-out',a:()=>toggleCls('wn-outline'),en:ed},
   {l:'Shadow',c:s.shadow,cls:'s-sha',a:()=>toggleCls('wn-shadow'),en:ed},
   {l:'Strikethru',c:s.strike,st:'text-decoration:line-through',a:()=>cmd(()=>ex('strikeThrough')),en:ed},'-',
   {l:'Superscript',c:s.sup,a:()=>cmd(()=>ex('superscript')),en:ed},{l:'Subscript',c:s.sub,a:()=>cmd(()=>ex('subscript')),en:ed}]}},
 {id:'view',t:'View',items:()=>{const m=viewMode();return[
   {l:'Show Ruler',c:prefs.ruler,a:()=>setPref('ruler',!prefs.ruler)},{l:'Show Invisibles',c:prefs.inv,a:()=>setPref('inv',!prefs.inv)},'-',
   {l:'Fit Page to Window',c:m==='fit',a:()=>setPref('view','fit')},{l:'Actual Size',c:m==='actual',a:()=>setPref('view','actual')},{l:'Wrap to Window',c:m==='wrap',a:()=>setPref('view','wrap')},'-',
   {l:'Classic (black & white)',c:prefs.look==='classic',a:()=>setPref('look','classic')},{l:'Platinum',c:prefs.look==='platinum',a:()=>setPref('look','platinum')}]}},
 {id:'help',t:'Help',items:()=>[{l:'WriteNow Help…',a:help},{l:'About WriteNow…',a:about}]}
];
MENUS.forEach(m=>{const d=document.createElement('div');d.className='mt';d.dataset.id=m.id;d.innerHTML=m.t;d.setAttribute('role','menuitem');mbar.appendChild(d)});

let openId=null,menuEl=null,busy=false,curItems=[];
function closeMenu(){if(menuEl)menuEl.remove();menuEl=null;openId=null;$$('.mt.open').forEach(x=>x.classList.remove('open'))}
function openMenu(t){
  closeMenu();const m=MENUS.find(x=>x.id===t.dataset.id);openId=m.id;t.classList.add('open');
  curItems=m.items();menuEl=document.createElement('div');menuEl.className='menu';menuEl.setAttribute('role','menu');
  curItems.forEach((it,i)=>{
    if(it==='-'){const s=document.createElement('div');s.className='sep';menuEl.appendChild(s);return}
    const en=it.en?it.en():!!it.a;
    const d=document.createElement('div');d.className='mi'+(en?'':' dis');d.dataset.i=i;
    d.innerHTML=`<span class="ck">${it.c?'✓':''}</span><span class="l ${it.cls||''}" style="${it.st||''}">${esc(it.l)}</span><span class="k">${fmtKey(it.k||'')}</span>`;
    menuEl.appendChild(d);
  });
  document.body.appendChild(menuEl);
  const r=t.getBoundingClientRect();menuEl.style.left=clamp(r.left,2,innerWidth-menuEl.offsetWidth-4)+'px';menuEl.style.top=r.bottom+'px';
  menuEl.addEventListener('pointerdown',e=>e.preventDefault());
  menuEl.addEventListener('pointerover',e=>{const it=e.target.closest('.mi');$$('.mi.hi',menuEl).forEach(x=>x!==it&&x.classList.remove('hi'));if(it&&!it.classList.contains('dis'))it.classList.add('hi')});
  menuEl.addEventListener('pointerleave',()=>$$('.mi.hi',menuEl).forEach(x=>x.classList.remove('hi')));
  menuEl.addEventListener('pointerup',e=>{const it=e.target.closest('.mi');if(it)choose(it)});
}
function choose(el){
  if(busy)return;const it=curItems[+el.dataset.i];
  if(!it||el.classList.contains('dis')){closeMenu();return}
  busy=true;let n=0;
  const blink=()=>{el.classList.toggle('hi');if(++n<4)setTimeout(blink,45);else{busy=false;closeMenu();run(it)}};
  el.classList.add('hi');setTimeout(blink,45);
}
function run(it){try{it.a()}catch(e){console.error(e);beep()}}
mbar.addEventListener('pointerdown',e=>{const t=e.target.closest('.mt');if(!t)return;e.preventDefault();if(openId===t.dataset.id){closeMenu();return}openMenu(t)});
mbar.addEventListener('pointerover',e=>{const t=e.target.closest('.mt');if(t&&openId&&openId!==t.dataset.id)openMenu(t)});
document.addEventListener('pointerdown',e=>{if(openId&&!e.target.closest('.menu,.mt'))closeMenu()},true);
addEventListener('blur',closeMenu);

/* keyboard shortcuts from the menu definitions */
function parseKey(k){return{sh:k.includes('⇧'),key:k.replace(/[⇧⌘]/g,'').toLowerCase()}}
document.addEventListener('keydown',e=>{
  if(modal){
    if(e.key==='Escape'){e.preventDefault();const c=modal.buttons.find(b=>b.cancel);if(c)c.el.click();else modal.close()}
    else if(e.key==='Enter'&&!(e.target.tagName==='BUTTON')){e.preventDefault();const d=modal.buttons.find(b=>b.def);if(d&&!d.el.disabled)d.el.click()}
    return;
  }
  if(e.key==='Escape'&&openId){closeMenu();return}
  const mod=e.metaKey||e.ctrlKey;if(!mod||e.altKey)return;
  if(e.target.tagName==='INPUT'&&!/^[fg]$/i.test(e.key))return;
  const key=e.key.toLowerCase();
  if(key==='y'&&!e.shiftKey&&ed()){e.preventDefault();restoreSel();redo();return}
  for(const m of MENUS){for(const it of m.items()){
    if(it==='-'||!it.k)continue;const p=parseKey(it.k);
    if(p.key===key&&p.sh===e.shiftKey){
      if(it.native)return;
      const en=it.en?it.en():!!it.a;e.preventDefault();
      if(en){const t=$(`.mt[data-id="${m.id}"]`);t.classList.add('open');setTimeout(()=>t.classList.remove('open'),110);run(it)}else beep();
      return;
    }
  }}
});

/* ---------------- boot ---------------- */
const savedPrefs=sget('wn-prefs');if(savedPrefs)Object.assign(prefs,savedPrefs);
ex('defaultParagraphSeparator','p');
placeWin();applyPrefs();
const cur=sget('wn-current');
if(cur&&cur.doc&&cur.doc.h&&cur.doc.h.body){st.n=cur.n||0;loadDoc(cur.doc,cur.name||'Untitled-1',cur.saved||null);dirty=!!cur.dirty;if(cur.open===false){st.n=(cur.n||0)+1;loadDoc({h:{body:'<p><br></p>'}},'Untitled-'+st.n,null)}}
else loadDoc({h:SAMPLE},'Read Me',null);
setTimeout(()=>{applyView();layout()},300);
// "Open with > WriteNow" on Windows starts the app as index.html?pdf=<path to the file>.
const pdfArg=location.search.match(/[?&]pdf=(.+)$/);
if(pdfArg){
  let path=pdfArg[1];try{path=decodeURIComponent(path)}catch(e){}
  path=path.replace(/^"|"$/g,'').split(String.fromCharCode(92)).join('/');
  const name=path.split('/').pop();
  const url='file:///'+encodeURI(path.replace(/^[/]+/,'')).replace(/#/g,'%23').replace(/[?]/g,'%3F');
  const x=new XMLHttpRequest();x.open('GET',url);x.responseType='arraybuffer';
  x.onload=()=>{if(x.response&&x.response.byteLength)openPdf(name,x.response);else msg('The file could not be read.','Could not open “'+name+'”')};
  x.onerror=()=>msg('The file could not be read.','Could not open “'+name+'”');
  x.send();
}else welcome();
// Installed as a web app (Edge/Chrome): PDFs opened with "Open with > WriteNow" arrive here.
if('launchQueue' in window)window.launchQueue.setConsumer(async params=>{if(params.files&&params.files.length)readFile(await params.files[0].getFile())});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawRuler();layout()});
})();
</script>
